# GitHub actions workflow.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Build+Test CI

on:
  push:
    branches: [main, gh-actions]
    tags: [v*]
  pull_request:
    types: [opened]
    branches: [main]
  # Allow for manual triggers from the web.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test-cxx:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7

    # Create fake source to build.
    - name: Generate source
      run: echo "int main(){}" > test.c

    # Run the action using the current source version.
    - name: Run self action
      uses: ./
      with:
        email: noreply@localhost.localdomain
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
        command: make test

  self-test-capture:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7

    # Create fake source to capture.
    - name: Generate source
      run: printf '#!/usr/bin/env python3\nprint()\n' > test.py

    # Run the action using the current source version.
    - name: Run self action
      uses: ./
      with:
        email: noreply@localhost.localdomain
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
        command:
        capture_command: --project-dir .
